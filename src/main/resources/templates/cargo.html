<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Доставка грузов</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="container">
    <h1>Доставка грузов</h1>

    <!-- Основные навигационные кнопки -->
    <div class="buttons">
        <a href="/autoblog" style="text-decoration: none;">
            <button type="button">Автоблог</button>
        </a>
        <a href="/admin" th:if="${currentUser != null && currentUser.hasRole('ROLE_ADMIN')}" style="text-decoration: none;">
            <button type="button">Админ-панель</button>
        </a>
        <a href="/login" th:if="${currentUser == null}" style="text-decoration: none;">
            <button type="button">Войти</button>
        </a>
        <a href="/register" th:if="${currentUser == null}" style="text-decoration: none;">
            <button type="button">Регистрация</button>
        </a>
        <a th:href="@{/logout}" th:if="${currentUser != null}" style="text-decoration: none;">
            <button type="button" class="btn-danger">Выйти из аккаунта</button>
        </a>
    </div>

    <!-- Поиск грузов -->
    <div>
        <h4>Поиск груза</h4>
        <form th:action="@{/cargo}" method="get">
            <input type="text" name="keyword" id="keyword" size="70" th:value="${keyword}" required />
            <input type="submit" class="btn-success" value="Поиск" />
            <button type="button" class="btn-warning" onclick="clearSearch()">Очистить</button>
        </form>
    </div>

    <!-- Управление грузами -->
    <div class="buttons">
        <button type="button" onclick="showModal('addTransferModal')">Добавить груз</button>
        <a href="/chart" style="text-decoration: none;">
            <button type="button">Посмотреть гистограмму</button>
        </a>
    </div>

    <!-- Таблица грузов -->
    <table id="cargo-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Название груза</th>
            <th>Содержимое груза</th>
            <th>Город отправки</th>
            <th>Дата отправки</th>
            <th>Город доставки</th>
            <th>Дата прибытия</th>
            <th th:if="${currentUser != null && currentUser.hasRole('ROLE_ADMIN')}">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="transfer : ${listTransfers}">
            <td th:text="${transfer.id}">ID</td>
            <td th:text="${transfer.name}">Название груза</td>
            <td th:text="${transfer.description}">Содержимое груза</td>
            <td th:text="${transfer.cityfrom}">Город отправки</td>
            <td th:text="${transfer.datefrom}">Дата отправки</td>
            <td th:text="${transfer.cityto}">Город доставки</td>
            <td th:text="${transfer.dateto}">Дата прибытия</td>
            <td th:if="${currentUser != null && currentUser.hasRole('ROLE_ADMIN')}">
                <a th:href="@{/api/cargo/delete(id=${transfer.id})}" onclick="return confirm('Удалить груз?')">
                    <button type="button" class="btn-danger">Удалить</button>
                </a>
            </td>
        </tr>
        </tbody>
    </table>

    <p>
        <script>
            function getRowCount() {
                const count = document.querySelectorAll('#cargo-table tbody tr').length;
                document.write(`Количество грузов в таблице: ${count}`);
            }
            getRowCount();
        </script>
    </p>

    <!-- Модальное окно для добавления -->
    <div id="addTransferModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="hideModal('addTransferModal')">&times;</span>
            <h2>Добавить груз</h2>
            <form id="addTransferForm" th:action="@{/api/cargo}" method="post">
                <input type="text" name="name" placeholder="Название груза" required />
                <input type="text" name="description" placeholder="Содержимое груза" required />
                <!-- Остальные поля -->
                <input type="submit" value="Сохранить" />
            </form>
        </div>
    </div>
</div>

<script>
    function clearSearch() {
        window.location = "/cargo";
    }

    function showModal(id) {
        document.getElementById(id).style.display = "block";
    }

    function hideModal(id) {
        document.getElementById(id).style.display = "none";
    }
</script>
</body>
</html>
